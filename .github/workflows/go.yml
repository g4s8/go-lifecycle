name: CI
"on":
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: Install deps
        run: go install golang.org/x/tools/cmd/stringer@latest
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Race check
        run: make test-race
